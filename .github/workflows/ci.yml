name: Autonomous VSA Cognitive Kernel CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  rust-kernel-build:
    name: Build & Test Native Rust VSA Kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust Crate with LTO
        run: |
          cd aether_cortex_vsa
          cargo build --release --verbose
      - name: Run Rust Unit Tests
        run: |
          cd aether_cortex_vsa
          cargo test --verbose

  python-cognitive-substrate:
    name: Verify Mathematical Organs & Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Execute Discovery-100 Mathematical Audit Suite
        run: |
          python aethermind_cognitive_substrate/tests/run_all_audits.py --workers 2
